name: CI

on:
  pull_request:
  push:
    # This repo has no `main` branch -- the real trunk is
    # `platform/foundation-20260714` (confirmed via `git remote show
    # origin`'s "HEAD branch"). The previous `[main]` filter meant this
    # workflow never fired on a trunk push, only on `pull_request` events
    # -- a stale reference to a branch name that was never renamed here,
    # not a deliberate choice to disable push-triggered CI.
    branches: [platform/foundation-20260714]

jobs:
  lockfile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any unauthorized lockfile exists
        run: |
          for f in package-lock.json yarn.lock bun.lock bun.lockb; do
            if [ -f "$f" ]; then
              echo "::error::Unauthorized lockfile found: $f. This repository uses pnpm ONLY -- see PLATFORM_FOUNDATION.md."
              exit 1
            fi
          done
          echo "OK - only pnpm-lock.yaml present."

  build:
    runs-on: ubuntu-latest
    needs: lockfile-check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
